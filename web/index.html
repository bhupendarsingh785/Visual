<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03070d">
<title>{{NAME}}</title>
<style>
:root{--c:#3ee7ff;--c2:#1a7dff;--bg:#03070d;--t:#d8f6ff;--m:#6c8a99;--warn:#ff5d73}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:radial-gradient(ellipse at 50% 30%,#0a1d2b 0%,var(--bg) 65%);color:var(--t);
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:auto;padding:12px 14px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;letter-spacing:.42em;font-size:15px;color:var(--c);text-shadow:0 0 14px var(--c)}
.chips{display:flex;gap:6px}
.chip{font-size:10px;padding:3px 8px;border-radius:20px;border:1px solid #1d3b4a;color:var(--m)}
.chip.on{border-color:var(--c);color:var(--c)}
.stage{position:relative;height:38vh;min-height:220px;display:grid;place-items:center}
.orb{position:relative;width:min(56vw,230px);aspect-ratio:1;border-radius:50%;cursor:pointer;
 background:radial-gradient(circle at 50% 50%,#bff8ff 0%,var(--c) 18%,var(--c2) 45%,#06213a 70%,transparent 72%);
 box-shadow:0 0 50px var(--c),0 0 120px #0b6fb8 inset;animation:breathe 3.4s ease-in-out infinite;transition:filter .3s}
.ring{position:absolute;inset:-14%;border-radius:50%;border:1px dashed #2bd2ff66;animation:spin 18s linear infinite}
.ring.r2{inset:-28%;border:1px solid #1a7dff33;border-top-color:var(--c);animation-duration:7s;animation-direction:reverse}
.ring.r3{inset:-40%;border:2px dotted #3ee7ff22;animation-duration:40s}
.listening .orb{animation:pulse .7s ease-in-out infinite;filter:hue-rotate(-40deg) saturate(1.4)}
.thinking .orb{animation:breathe .9s ease-in-out infinite;filter:hue-rotate(60deg)}
.speaking .orb{animation:talk .25s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.04);box-shadow:0 0 80px var(--c),0 0 120px #0b6fb8 inset}}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes talk{to{transform:scale(1.07)}}
.state{position:absolute;bottom:6px;font-size:12px;color:var(--m);letter-spacing:.12em}
.log{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:#0f2d44;border:1px solid #1d4d6e}
.ai{align-self:flex-start;background:#071824;border:1px solid #0f3a52;box-shadow:0 0 18px #0a3b5a55}
.ai a{color:var(--c)}
.step{align-self:flex-start;font-size:11px;color:var(--c);opacity:.75;padding-left:6px}
.msg img{max-width:100%;border-radius:10px;margin-top:6px}
.bar{display:flex;gap:8px;align-items:center;padding:8px 0}
.bar input{flex:1;background:#06131c;border:1px solid #16384c;color:var(--t);border-radius:24px;padding:12px 16px;font-size:15px;outline:none}
.bar input:focus{border-color:var(--c)}
.btn{width:46px;height:46px;border-radius:50%;border:1px solid #1d4d6e;background:#071c2a;color:var(--c);font-size:19px;display:grid;place-items:center;flex:none}
.btn.mic{width:54px;height:54px;background:radial-gradient(circle,#0e5f8c,#06233a);box-shadow:0 0 18px #13a6e055}
.listening .btn.mic{background:radial-gradient(circle,#ff5d73,#5c1020);color:#fff}
video{display:none;position:fixed;inset:auto 14px 90px auto;width:42vw;max-width:220px;border-radius:12px;border:1px solid var(--c);z-index:5}
.drawer{font-size:12px;color:var(--m);display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.drawer a{color:var(--c);border:1px solid #16384c;border-radius:12px;padding:3px 9px;white-space:nowrap;text-decoration:none}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">{{NAME}}</div>
    <div class="chips"><span class="chip" id="cBrain">dimaag</span><span class="chip" id="cPhone">phone</span><span class="chip" id="cScreen">screen</span></div>
  </header>
  <div class="stage">
    <div class="orb" id="orb"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div></div>
    <div class="state" id="state">orb dabao aur bolo</div>
  </div>
  <div class="drawer" id="drawer"></div>
  <div class="log" id="log"></div>
  <div class="bar">
    <button class="btn" id="cam" title="Camera se dikhao">&#128247;</button>
    <input id="txt" placeholder="{{NAME}} se kuch bhi kaho..." autocomplete="off">
    <button class="btn mic" id="mic" title="Bolo">&#127908;</button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<video id="vid" autoplay playsinline muted></video>
<script>
const $=id=>document.getElementById(id), app=$('app'), log=$('log');
let pin=new URLSearchParams(location.search).get('pin')||localStorage.getItem('vpin')||'';
let camStream=null, rec=null, busy=false;
function setState(s,label){app.className='app '+(s||'');$('state').textContent=label||'orb dabao aur bolo'}
function linkify(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank">$1</a>')}
function add(cls,text,img){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=linkify(text||'');
 if(img){const i=new Image();i.src=img;d.appendChild(i)} log.appendChild(d);log.scrollTop=log.scrollHeight}
function step(t){const d=document.createElement('div');d.className='step';d.textContent='⚙ '+t;log.appendChild(d)}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Pin':pin},body:body?JSON.stringify(body):undefined});
 if(r.status===401){pin=prompt('PIN daalo')||'';localStorage.setItem('vpin',pin);return api(path,body)} return r.json()}
async function status(){try{const s=await api('/api/status');$('cBrain').classList.toggle('on',s.brain.length>0);
 $('cPhone').classList.toggle('on',s.termux_api);$('cScreen').classList.toggle('on',s.screen);
 $('drawer').innerHTML=s.creations.filter(n=>!n.startsWith('_')).slice(-12).map(n=>`<a href="/creations/${encodeURIComponent(n)}" target="_blank">✦ ${n}</a>`).join('')}catch(e){}}
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t.replace(/https?:\/\/\S+/g,'link').replace(/[*_#`]/g,'').slice(0,700));
 u.lang='hi-IN';u.rate=1.05;const v=speechSynthesis.getVoices().find(v=>/hi[-_]IN/i.test(v.lang));if(v)u.voice=v;
 u.onstart=()=>setState('speaking','bol raha hoon');u.onend=()=>setState();speechSynthesis.speak(u)}
async function send(text,image){if(busy||(!text&&!image))return;busy=true;add('me',text||'(tasveer)',image);$('txt').value='';
 setState('thinking','soch raha hoon...');
 try{const r=await api('/api/chat',{text,image});(r.steps||[]).forEach(step);add('ai',r.reply);setState();say(r.reply)}
 catch(e){add('ai','Server se jud nahi paaya. Termux mein "python visual.py" chal raha hai?');setState()}
 busy=false;status()}
// aawaz
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(){if(!SR){add('ai','Is browser mein mic nahi chalta. Chrome use karo.');return}
 if(rec){rec.stop();return} speechSynthesis.cancel(); rec=new SR();rec.lang='hi-IN';rec.interimResults=true;
 let final='';rec.onresult=e=>{let t='';for(const r of e.results){t+=r[0].transcript;if(r.isFinal)final=t}$('txt').value=t};
 rec.onstart=()=>setState('listening','sun raha hoon...');
 rec.onend=()=>{rec=null;setState();const t=(final||$('txt').value).trim();if(t)send(t,camStream?grab():null)};
 rec.onerror=e=>{rec=null;setState();if(e.error==='not-allowed')add('ai','Mic ki permission do (Chrome site settings).')};rec.start()}
$('mic').onclick=listen;$('orb').onclick=listen;
$('txt').onkeydown=e=>{if(e.key==='Enter')send($('txt').value.trim(),camStream?grab():null)};
// camera: live dikhao, bolte waqt frame saath jaata hai
function grab(){const v=$('vid'),c=document.createElement('canvas'),w=640;c.width=w;c.height=Math.round(v.videoHeight*w/(v.videoWidth||1));
 c.getContext('2d').drawImage(v,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7)}
$('cam').onclick=async()=>{if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;$('vid').style.display='none';$('cam').style.color='';return}
 try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('vid').srcObject=camStream;$('vid').style.display='block';$('cam').style.color='#ff5d73';
 add('ai','Camera chalu. Ab jo bologe, main saath mein dekhunga bhi. Dobara dabao to band.')}
 catch(e){$('file').click()}};
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>send($('txt').value.trim()||'Ye dekho',r.result);r.readAsDataURL(f)};
add('ai','Namaste {{OWNER}}! Main {{NAME}} hoon. Mic dabao aur bolo: "WhatsApp kholo", "aaj ki khabar batao", "meri screen dekho", "ek chhota game banao"...');
status();speechSynthesis&&speechSynthesis.getVoices();
</script>
</body>
</html>

name: VISUAL real Physics data acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: visual-physics-real-data
  cancel-in-progress: false

jobs:
  acquire-gwosc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official GWOSC client
        run: python -m pip install --disable-pip-version-check gwosc==0.8.3
      - name: Download measured LIGO strain data
        env:
          VISUAL_PHYSICS_RAW_DIR: physics-raw-data/gwosc
        run: python scripts/physics/download_gwosc_sample.py
      - name: Verify manifest, checksums and payloads
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("physics-raw-data/gwosc")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["actual_file_count"] == 2, manifest
          assert manifest["complete_for_requested_detectors"], manifest
          for item in manifest["files"]:
              path = Path(item["file"])
              assert path.is_file() and path.stat().st_size == item["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"]
              assert path.read_bytes()[:8] == bytes.fromhex("894844460d0a1a0a")
          print("Verified real data bytes:", manifest["total_bytes"])
          print("Verified files:", manifest["actual_file_count"])
          print("SHA-256 and HDF5 signatures: OK")
          PY
      - name: Upload original data and provenance
        uses: actions/upload-artifact@v4
        with:
          name: visual-physics-real-gwosc-${{ github.run_id }}
          path: physics-raw-data/gwosc/
          if-no-files-found: error
          retention-days: 30

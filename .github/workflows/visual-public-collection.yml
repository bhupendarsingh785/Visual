name: VISUAL public knowledge collection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/visual-public-collection.yml
      - plugins/knowledge_base/**
      - scripts/github_collect_public.py
  workflow_dispatch:
    inputs:
      topics:
        description: "Comma-separated domain keys; blank means all domains"
        required: false
        type: string
        default: ""
      max_requests:
        description: "API requests for this run (1-300; larger batches take longer)"
        required: false
        type: number
        default: 300
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

env:
  VISUAL_HOME: ${{ github.workspace }}/.visual

concurrency:
  group: visual-public-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore previous local index cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.visual
          key: visual-kb-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            visual-kb-${{ runner.os }}-
      - name: Collect public research metadata
        env:
          PYTHONPATH: plugins/knowledge_base
          VISUAL_TOPICS: ${{ inputs.topics || '' }}
          VISUAL_MAX_REQUESTS: ${{ inputs.max_requests || '300' }}
          VISUAL_PER_REQUEST: "25"
        run: python scripts/github_collect_public.py
      - name: Stage SQLite knowledge index
        run: |
          test -s "$VISUAL_HOME/knowledge.sqlite3"
          cp "$VISUAL_HOME/knowledge.sqlite3" ./knowledge.sqlite3
      - name: Upload collection report and SQLite index
        uses: actions/upload-artifact@v4
        with:
          name: visual-public-knowledge-${{ github.run_id }}
          path: |
            visual-collection-report.json
            knowledge.sqlite3
          if-no-files-found: warn
          retention-days: 30

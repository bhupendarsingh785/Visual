name: VISUAL offline checks

on:
  push:
    branches: ["main", "upgrade/**"]
  pull_request:
    branches: ["main"]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q visual.py plugins
      - name: Import VISUAL and verify integrated plugin tools
        run: |
          VISUAL_SELFTEST=1 python -c "import sys; sys.argv=['visual.py']; import visual; required={'dev_task_create','dev_orchestration_start','self_intelligence_audit','store_last','recall_last','handle_dohrao','knowledge_add_source','knowledge_ingest','knowledge_search','knowledge_status','knowledge_queue_catalog','knowledge_collect_now','knowledge_import_local','knowledge_download_dataset','knowledge_harvest_public_metadata','knowledge_collect_global_research','hardware_status','hardware_optimization_plan','hardware_compute_fabric_plan','hardware_dataset_manifest','hardware_multi_gpu_topology','hardware_ddp_initialize','hardware_load_onnx_model'}; missing=required-set(visual.TOOLS); assert not visual.PLUGIN_ERRORS, visual.PLUGIN_ERRORS; assert not missing, 'missing plugin tools: '+str(sorted(missing)); print('plugin import OK; tools=',len(visual.TOOLS))"
      - name: Validate Termux shell scripts
        run: bash -n install.sh update.sh scripts/visual-supervisor.sh
      - name: Test continuous listening logic (mocked Termux)
        run: python -m unittest discover -s plugins/continuous_listening -p 'test_*.py' -v
      - name: Test memory repeat storage (temporary test file)
        run: python -m unittest discover -s plugins/memory_repeat -p 'test_*.py' -v
      - name: Test core tool schema immutability
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test Self-Intelligence subsystem
        run: PYTHONPATH=plugins/self_intelligence python -m unittest discover -s plugins/self_intelligence -p 'test_*.py' -v
      - name: Test Hardware Optimizer
        run: python -m unittest discover -s plugins/hardware_optimizer -p 'test_*.py' -v
      - name: Test public Knowledge Base
        run: PYTHONPATH=plugins/knowledge_base python -m unittest discover -s plugins/knowledge_base -p 'test_*.py' -v
      - name: Test Autonomous Development subsystem
        run: PYTHONPATH=plugins/autonomous_development python -m unittest discover -s plugins/autonomous_development -p 'test_*.py' -v


  real-training-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch for a real optimizer-update test
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run real CPU training smoke test
        run: PYTHONPATH=plugins/hardware_optimizer python -m unittest test_training_runtime.RealTrainingSmokeTests test_distributed_training -v

  chip-rtl-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile AI compute tile
        run: |
          iverilog -g2012 -s tb_visual_ai_compute_tile -o /tmp/visual-chip.vvp \
            plugins/chip_lab/rtl/ai_simd_vector.sv \
            plugins/chip_lab/rtl/ai_xnor_popcount.sv \
            plugins/chip_lab/rtl/ai_spiking_neuron.sv \
            plugins/chip_lab/rtl/visual_ai_compute_tile.sv \
            plugins/chip_lab/tb/tb_visual_ai_compute_tile.sv
      - name: Run RTL smoke tests
        run: vvp /tmp/visual-chip.vvp
      - name: Compile multi-tile MAC cluster
        run: |
          iverilog -g2012 -s tb_visual_ai_chip_cluster -o /tmp/visual-ai-cluster.vvp \
            plugins/hardware_optimizer/chip_design/rtl/visual_ai_mac_tile.sv \
            plugins/hardware_optimizer/chip_design/rtl/visual_ai_chip_cluster.sv \
            plugins/hardware_optimizer/chip_design/tb/tb_visual_ai_chip_cluster.sv
      - name: Run multi-tile MAC cluster tests
        run: vvp /tmp/visual-ai-cluster.vvp

  chip-rtl-synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys synthesis tool
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Synthesize multi-tile INT8 MAC cluster and run structural checks
        run: |
          yosys -p "read_verilog -sv plugins/hardware_optimizer/chip_design/rtl/visual_ai_mac_tile.sv plugins/hardware_optimizer/chip_design/rtl/visual_ai_chip_cluster.sv; hierarchy -check -top visual_ai_chip_cluster; proc; opt; check; synth -top visual_ai_chip_cluster; check; stat"

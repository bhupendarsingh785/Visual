name: VISUAL Physics deep data - HEPData

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/visual-physics-hepdata.yml
      - scripts/physics/collect_hepdata_tables.py
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: read

concurrency:
  group: visual-physics-hepdata
  cancel-in-progress: false

jobs:
  collect-hepdata:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HEPData official client
        run: python -m pip install --disable-pip-version-check hepdata-cli
      - name: Restore HEPData incremental collection cursor
        uses: actions/cache@v4
        with:
          path: physics-raw-data/hepdata/query_cursor.json
          key: ${{ runner.os }}-visual-hepdata-cursor-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-visual-hepdata-cursor-
      - name: Search and download machine-readable physics tables
        env:
          VISUAL_PHYSICS_RAW_DIR: physics-raw-data/hepdata
          VISUAL_HEPDATA_MAX_RECORDS: "20"
          VISUAL_HEPDATA_MAX_BYTES: "1073741824"
        run: python scripts/physics/collect_hepdata_tables.py
      - name: Validate manifest and file checksums
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root = Path("physics-raw-data/hepdata")
          m = json.loads((root / "manifest.json").read_text())
          assert m["downloaded_file_count"] == len(m["files"])
          total = 0
          parsed_csv = 0
          nonempty_rows = 0
          for item in m["files"]:
              p = (root / item["path"]).resolve()
              assert p.is_relative_to(root.resolve()), f"path escapes dataset root: {item['path']}"
              assert p.is_file() and p.stat().st_size == item["bytes"] > 0
              payload = p.read_bytes()
              assert hashlib.sha256(payload).hexdigest() == item["sha256"]
              assert p.suffix.lower() == ".csv", f"unexpected format: {p.name}"
              text = payload.decode("utf-8-sig", errors="strict")
              rows = list(csv.reader(text.splitlines(), strict=True))
              useful_rows = sum(1 for row in rows if any(cell.strip() for cell in row))
              assert useful_rows > 0, f"empty/unparseable CSV: {item['path']}"
              parsed_csv += 1
              nonempty_rows += useful_rows
              total += len(payload)
          assert total == m["total_bytes"]
          assert parsed_csv == m["downloaded_file_count"] == len(m["files"])
          assert m["downloaded_record_ids"]
          print("HEPData CSV files parsed:", parsed_csv)
          print("Records deferred for retry:", len(m.get("failed_record_ids", [])))
          print("Non-empty CSV rows:", nonempty_rows)
          print("Verified bytes:", total)
          print("Portable paths, UTF-8, CSV syntax and SHA-256: OK")
          PY
      - name: Upload data and provenance
        uses: actions/upload-artifact@v4
        with:
          name: visual-physics-hepdata-${{ github.run_id }}
          path: physics-raw-data/hepdata/
          if-no-files-found: error
          retention-days: 30
